<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Rodas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-main: #0b0f17; --bg-surface: #151c28; --bg-card: #1e293b;
        --border-color: rgba(255, 255, 255, 0.08); --text-primary: #f8fafc;
        --text-secondary: #94a3b8; --accent-color: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.2); --price-color: #4ade80;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body { font-family: "Plus Jakarta Sans", sans-serif; background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }

      .topbar { position: sticky; top: 0; z-index: 20; background: rgba(11, 15, 23, 0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); }
      .topbar-main { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1400px; margin: 0 auto; width: 100%; }
      .topbar-titulo { font-size: 1.1rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
      .search-wrapper { position: relative; flex: 1; min-width: 0; max-width: 500px; }
      #searchInput { width: 100%; padding: 9px 14px 9px 38px; font-size: 0.9rem; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--border-color); border-radius: 99px; outline: none; }
      .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; font-size: 0.9rem; }

      .btn-toggle-filtros { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); border-radius: 99px; cursor: pointer; position: relative; }
      .btn-toggle-filtros.aberto { background: var(--accent-color); color: #0f172a; }
      .btn-toggle-filtros .seta { transition: transform 0.25s ease; font-size: 0.65rem; }
      .btn-toggle-filtros.aberto .seta { transform: rotate(180deg); }
      .badge-filtros { display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 800; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; align-items: center; justify-content: center; border: 2px solid var(--bg-main); }
      .btn-toggle-filtros.tem-filtro .badge-filtros { display: flex; }

      .contador { padding: 0 16px 8px; text-align: center; font-size: 0.75rem; color: var(--text-secondary); }
      .painel-filtros { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.3s ease; opacity: 0; background: var(--bg-surface); border-top: 1px solid var(--border-color); }
      .painel-filtros.aberto { max-height: 400px; opacity: 1; padding: 14px 16px; }
      .painel-conteudo { display: flex; flex-direction: column; gap: 12px; align-items: center; }

      .filtros-status { display: flex; background: rgba(0, 0, 0, 0.25); padding: 4px; border-radius: 99px; border: 1px solid var(--border-color); }
      .btn-status { padding: 7px 16px; font-size: 0.78rem; font-weight: 700; border-radius: 99px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; }
      .btn-status.ativo { background: var(--accent-color); color: #0f172a; }
      .btn-status.ativo[data-status="vendidos"] { background: #ef4444; color: #ffffff; }
      .filtros { display: flex; flex-wrap: nowrap; gap: 8px; padding: 2px 4px; overflow-x: auto; }
      .filtros .chip { padding: 7px 14px; font-size: 0.78rem; border: 1px solid var(--border-color); border-radius: 99px; background: rgba(255, 255, 255, 0.03); color: var(--text-secondary); cursor: pointer; font-weight: 600; }
      .filtros .chip.ativo { background: rgba(255, 255, 255, 0.15); color: #fff; }
      .ordenacao select { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 0.8rem; background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); outline: none; }

      .loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text-secondary); }
      .spinner { width: 44px; height: 44px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-color); border-radius: 50%; animation: girar 0.8s linear infinite; margin-bottom: 18px; }
      @keyframes girar { to { transform: rotate(360deg); } }

      .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
      .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
      .card.vendido::before { content: "VENDIDO"; position: absolute; top: 16px; right: -32px; background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 800; padding: 4px 36px; transform: rotate(35deg); z-index: 2; }
      .card.vendido img { filter: grayscale(80%) opacity(0.6); }
      .card img { width: 100%; height: 220px; object-fit: cover; background: #0f172a; border-bottom: 1px solid var(--border-color); cursor: zoom-in; }
      .card-body { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .codigo { font-size: 0.75rem; font-weight: 700; color: var(--accent-color); }
      .card-body h3 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); min-height: 2.8em; }
      .badges { display: flex; flex-wrap: wrap; gap: 6px; }
      .status, .dispo { font-size: 0.65rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
      .status { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
      .dispo { background: rgba(239, 68, 68, 0.15); color: #f87171; }
      .preco { font-size: 1.4rem; font-weight: 800; color: var(--price-color); margin-top: auto; }
      .vazio { grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 80px 20px; }
      footer { background: var(--bg-surface); border-top: 1px solid var(--border-color); color: var(--text-secondary); text-align: center; padding: 20px; font-size: 0.85rem; }

      .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
      .lightbox.ativo { display: flex; }
      .lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 12px; }
      .lightbox-close { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .lightbox-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); padding: 12px 20px; border-radius: 12px; color: #fff; text-align: center; width: 90%; }
      .lightbox-info .cod { font-size: 0.75rem; color: var(--accent-color); font-weight: 700; }
      .lightbox-info .nome { font-size: 0.9rem; margin-top: 4px; color: #e2e8f0; }
      .lightbox-info .preco-lb { font-size: 1.2rem; font-weight: 800; color: var(--price-color); margin-top: 4px; }

      /* --- BOTÃO ADMIN NO CARD --- */
      .btn-admin-card {
        display: none; /* Escondido por padrão */
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
      }
      .btn-admin-card.disponivel {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.4);
      }
      body.admin-mode .btn-admin-card { display: block; }
      
      /* --- MODAL DE PIN --- */
      .pin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
      .pin-overlay.ativo { display: flex; }
      .pin-box { background: var(--bg-card); padding: 24px; border-radius: 16px; width: 300px; text-align: center; border: 1px solid var(--border-color); }
      .pin-box h3 { margin-bottom: 16px; font-size: 1.2rem; }
      .pin-box input { width: 100%; padding: 12px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 16px; outline: none; }
      .pin-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
      .btn-confirmar { background: var(--accent-color); color: #000; margin-bottom: 8px; }
      .btn-cancelar { background: transparent; color: var(--text-secondary); }

      @media (max-width: 700px) {
        .topbar-titulo .texto-titulo { display: none; }
        .grid-container { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; padding: 16px 12px; }
        .card img { height: 160px; }
        .card-body { padding: 12px; }
        .card-body h3 { font-size: 0.85rem; }
        .preco { font-size: 1.15rem; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-main">
        <!-- ID adicionado para detectar cliques e abrir o PIN -->
        <div class="topbar-titulo" id="tituloApp">🛞 <span class="texto-titulo">Catálogo</span></div>
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar por código, aro ou modelo..." autocomplete="off" />
        </div>
        <button class="btn-toggle-filtros" id="btnToggleFiltros">
          <span>⚙️</span><span class="seta">▼</span>
          <span class="badge-filtros" id="badgeFiltros">0</span>
        </button>
      </div>
      <p id="contador" class="contador"></p>
      <div class="painel-filtros" id="painelFiltros">
        <div class="painel-conteudo">
          <div class="filtros-status">
            <button class="btn-status ativo" data-status="disponiveis">Disponíveis</button>
            <button class="btn-status" data-status="vendidos">Vendidos</button>
            <button class="btn-status" data-status="todos">Todos</button>
          </div>
          <div class="filtros" id="filtrosAro"></div>
          <div class="ordenacao">
            <select id="ordenarPor">
              <option value="codigo">Código</option>
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
              <option value="nome">Nome (A-Z)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="loading" id="loadingBox">
      <div class="spinner"></div>
      <p id="loadingText">Carregando catálogo...</p>
    </div>

    <main id="gridRodas" class="grid-container" style="display: none"></main>
    <footer><p>© Catálogo de Rodas</p></footer>

    <!-- MODAL DO PIN -->
    <div class="pin-overlay" id="pinOverlay">
      <div class="pin-box">
        <h3>🔒 Acesso Restrito</h3>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px;">Digite o PIN de administrador para editar o status das rodas.</p>
        <input type="password" id="inputPin" placeholder="••••" maxlength="4" inputmode="numeric" />
        <button class="btn-confirmar" onclick="verificarPin()">Entrar</button>
        <button class="btn-cancelar" onclick="fecharPin()">Cancelar</button>
      </div>
    </div>

    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightboxClose">✕</button>
      <img id="lightboxImg" src="" alt="" />
      <div class="lightbox-info">
        <div class="cod" id="lightboxCod"></div>
        <div class="nome" id="lightboxNome"></div>
        <div class="preco-lb" id="lightboxPreco"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (function () {
        "use strict";

        const supabaseUrl = "https://kiiswukzwwoznkgjyaod.supabase.co";
        const supabaseKey = "sb_publishable_WPRvraB-40Fz1RuKbd5bRg_3tGvyAxg";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // O PIN para liberar o modo admin (pode alterar aqui)
        const PIN_ADMIN = "1234";

        const isNative = window.Capacitor && window.Capacitor.isNativePlatform();
        const { Filesystem, Directory } = window.Capacitor ? window.Capacitor.Plugins : {};

        let produtos = [];
        let filtroStatusAtual = "disponiveis";
        let filtroAroAtual = "todos";
        let ordenacaoAtual = "codigo";
        let isAdmin = false; // Controla o modo admin

        async function baixarImagemBase64(url) {
          const resposta = await fetch(url);
          const blob = await resposta.blob();
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(blob);
          });
        }

        async function carregarProdutos() {
          const loadingText = document.getElementById("loadingText");
          const cache = localStorage.getItem("@catalogo_dados");
          
          if (cache) {
            produtos = JSON.parse(cache).map(p => ({ ...p, valor: Number(p.valor) || 0 }));
            gerarChipsDeAro();
            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("gridRodas").style.display = "grid";
            renderizar();
          }

          try {
            loadingText.innerText = cache ? "Atualizando dados..." : "Baixando dados da nuvem...";
            const { data, error } = await supabaseClient.from("catalogo_rodas").select("*").order("codigo", { ascending: true });
            if (error) throw error;
            
            if (data && data.length > 0) {
              localStorage.setItem("@catalogo_dados", JSON.stringify(data));
              produtos = data.map(p => ({ ...p, valor: Number(p.valor) || 0 }));
              
              if (isNative && Filesystem) {
                loadingText.innerText = "Sincronizando fotos...";
                await sincronizarFotosCelular(data);
              }

              gerarChipsDeAro();
              document.getElementById("loadingBox").style.display = "none";
              document.getElementById("gridRodas").style.display = "grid";
              renderizar();
            }
          } catch (err) {
            console.warn("Usando modo offline.", err);
            if (!cache) {
              document.getElementById("loadingBox").innerHTML = `<p style="color:#f87171; text-align:center; padding: 20px;">Sem internet e sem dados.<br>Conecte-se para baixar o catálogo.</p>`;
            }
          }
        }

        async function sincronizarFotosCelular(produtosData) {
          try {
            await Filesystem.requestPermissions();
            for (const prod of produtosData) {
              if (prod.fotos_urls && prod.fotos_urls.length > 0) {
                const nomeArquivo = `roda_${prod.codigo}.jpg`;
                try {
                  await Filesystem.stat({ path: `CatalogoRodas/${nomeArquivo}`, directory: Directory.Documents });
                } catch (e) {
                  const base64Data = await baixarImagemBase64(prod.fotos_urls[0]);
                  await Filesystem.writeFile({
                    path: `CatalogoRodas/${nomeArquivo}`,
                    data: base64Data,
                    directory: Directory.Documents,
                    recursive: true
                  });
                }
              }
            }
          } catch (e) {
            console.warn("Erro ao salvar fotos no celular:", e);
          }
        }

        async function obterUrlLocal(codigo) {
          if (!isNative || !Filesystem) return null;
          try {
            const caminho = `CatalogoRodas/roda_${codigo}.jpg`;
            await Filesystem.stat({ path: caminho, directory: Directory.Documents });
            const uriResult = await Filesystem.getUri({ path: caminho, directory: Directory.Documents });
            return window.Capacitor.convertFileSrc(uriResult.uri);
          } catch (e) {
            return null;
          }
        }

        function gerarChipsDeAro() {
          var container = document.getElementById("filtrosAro");
          container.innerHTML = "";
          var arosUnicos = [];
          produtos.forEach(function (p) {
            if (p.aro && arosUnicos.indexOf(p.aro) === -1) arosUnicos.push(p.aro);
          });
          arosUnicos.sort(function (a, b) { return a - b; });

          var chipTodos = document.createElement("button");
          chipTodos.className = "chip ativo";
          chipTodos.dataset.aro = "todos";
          chipTodos.textContent = "Todos";
          chipTodos.addEventListener("click", function () { ativarChipAro(chipTodos, "todos"); });
          container.appendChild(chipTodos);

          arosUnicos.forEach(function (aro) {
            var chip = document.createElement("button");
            chip.className = "chip";
            chip.dataset.aro = String(aro);
            chip.textContent = "Aro " + aro;
            chip.addEventListener("click", function () { ativarChipAro(chip, String(aro)); });
            container.appendChild(chip);
          });
        }

        function ativarChipAro(chipClicado, aro) {
          document.querySelectorAll("#filtrosAro .chip").forEach(function (c) { c.classList.remove("ativo"); });
          chipClicado.classList.add("ativo");
          filtroAroAtual = aro;
          renderizar();
        }

        function aplicarFiltros() {
          var lista = produtos.slice();
          if (filtroStatusAtual === "disponiveis") lista = lista.filter(p => !p.vendido);
          else if (filtroStatusAtual === "vendidos") lista = lista.filter(p => p.vendido);
          
          if (filtroAroAtual !== "todos") {
            var aro = parseInt(filtroAroAtual, 10);
            lista = lista.filter(p => p.aro === aro);
          }

          var termo = document.getElementById("searchInput").value.toLowerCase().trim();
          if (termo) {
            lista = lista.filter(p => p.codigo.toLowerCase().includes(termo) || p.nome.toLowerCase().includes(termo));
          }

          switch (ordenacaoAtual) {
            case "menor": lista.sort((a, b) => a.valor - b.valor); break;
            case "maior": lista.sort((a, b) => b.valor - a.valor); break;
            case "nome":  lista.sort((a, b) => a.nome.localeCompare(b.nome)); break;
            default:      lista.sort((a, b) => a.codigo.localeCompare(b.codigo));
          }
          return lista;
        }

        async function renderizar() {
          var lista = aplicarFiltros();
          var container = document.getElementById("gridRodas");
          container.innerHTML = "";
          document.getElementById("contador").textContent = lista.length + " roda(s) encontrada(s)";

          if (!lista.length) {
            container.innerHTML = '<p class="vazio">Nenhuma roda encontrada.</p>';
            return;
          }

          var frag = document.createDocumentFragment();
          
          for (const item of lista) {
            var card = document.createElement("div");
            card.className = "card" + (item.vendido ? " vendido" : "");

            var img = document.createElement("img");
            img.alt = item.nome;
            img.loading = "lazy";

            let urlLocal = await obterUrlLocal(item.codigo);
            if (urlLocal) {
              img.src = urlLocal;
            } else if (item.fotos_urls && item.fotos_urls.length > 0) {
              img.src = item.fotos_urls[0];
            } else {
              img.src = "fotos/placeholder.jpg";
            }

            img.addEventListener("click", function (e) { abrirLightbox(item, e.target.src); });
            card.appendChild(img);

            var body = document.createElement("div");
            body.className = "card-body";
            body.innerHTML = `
              <span class="codigo">CÓD: ${item.codigo}</span>
              <h3>${item.nome}</h3>
              <div class="badges">
                ${item.status && item.status !== 'NAN' ? `<span class="status">${item.status}</span>` : ''}
                ${item.disponibilidade && item.disponibilidade !== 'NAN' ? `<span class="dispo">${item.disponibilidade}</span>` : ''}
              </div>
              <p class="preco">R$ ${item.valor.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</p>
              <!-- BOTÃO ADMIN (só aparece no modo admin) -->
              <button class="btn-admin-card ${item.vendido ? 'disponivel' : ''}" onclick="alterarStatus('${item.codigo}', ${item.vendido})">
                ${item.vendido ? 'Marcar como Disponível' : 'Marcar como Vendido'}
              </button>
            `;
            card.appendChild(body);
            frag.appendChild(card);
          }
          container.appendChild(frag);
        }

        // FUNÇÃO QUE ALTERA O STATUS NO SUPABASE
        async function alterarStatus(codigo, statusAtual) {
          const novoStatus = !statusAtual;
          try {
            const { error } = await supabaseClient
              .from("catalogo_rodas")
              .update({ 
                vendido: novoStatus, 
                disponibilidade: novoStatus ? "VENDIDO" : "" 
              })
              .eq("codigo", codigo);

            if (error) throw error;

            // Atualiza a lista local e o cache
            const index = produtos.findIndex(p => p.codigo === codigo);
            if (index !== -1) {
              produtos[index].vendido = novoStatus;
              produtos[index].disponibilidade = novoStatus ? "VENDIDO" : "";
              localStorage.setItem("@catalogo_dados", JSON.stringify(produtos));
            }

            renderizar(); // Redesenha a tela para mostrar a mudança na hora
            alert(`Status alterado com sucesso! A roda agora está ${novoStatus ? 'VENDIDA' : 'DISPONÍVEL'}.`);

          } catch (err) {
            console.error(err);
            alert("Erro ao alterar status. Verifique a internet.");
          }
        }

        var btnToggle = document.getElementById("btnToggleFiltros");
        var painel = document.getElementById("painelFiltros");
        var badge = document.getElementById("badgeFiltros");

        btnToggle.addEventListener("click", function () {
          var aberto = painel.classList.toggle("aberto");
          btnToggle.classList.toggle("aberto", aberto);
        });

        var lightbox = document.getElementById("lightbox");
        var lightboxImg = document.getElementById("lightboxImg");
        var lightboxCod = document.getElementById("lightboxCod");
        var lightboxNome = document.getElementById("lightboxNome");
        var lightboxPreco = document.getElementById("lightboxPreco");
        var lightboxClose = document.getElementById("lightboxClose");

        function abrirLightbox(item, imgUrl) {
          lightboxImg.src = imgUrl;
          lightboxCod.textContent = "CÓD: " + item.codigo;
          lightboxNome.textContent = item.nome;
          lightboxPreco.textContent = "R$ " + item.valor.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
          lightbox.classList.add("ativo");
        }

        function fecharLightbox() { lightbox.classList.remove("ativo"); }
        lightboxClose.addEventListener("click", fecharLightbox);
        lightbox.addEventListener("click", function (e) { if (e.target === lightbox) fecharLightbox(); });

        document.getElementById("searchInput").addEventListener("input", renderizar);
        document.querySelectorAll(".btn-status").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".btn-status").forEach(b => b.classList.remove("ativo"));
            btn.classList.add("ativo");
            filtroStatusAtual = btn.dataset.status;
            renderizar();
          });
        });
        document.getElementById("ordenarPor").addEventListener("change", function (e) { ordenacaoAtual = e.target.value; renderizar(); });

        // ==========================================
        // LÓGICA DO MODO ADMIN (PIN)
        // ==========================================
        let cliquesTitulo = 0;
        document.getElementById("tituloApp").addEventListener("click", () => {
          if (isAdmin) {
            // Se já estiver no modo admin, clicar 3 vezes desativa
            cliquesTitulo++;
            if (cliquesTitulo >= 3) {
              isAdmin = false;
              document.body.classList.remove("admin-mode");
              cliquesTitulo = 0;
              alert("Modo Administrador desativado.");
            }
          } else {
            // Se não estiver, abre o modal de PIN
            document.getElementById("pinOverlay").classList.add("ativo");
            document.getElementById("inputPin").value = "";
            document.getElementById("inputPin").focus();
          }
        });

        window.verificarPin = function() {
          const pinDigitado = document.getElementById("inputPin").value;
          if (pinDigitado === PIN_ADMIN) {
            isAdmin = true;
            document.body.classList.add("admin-mode");
            fecharPin();
            renderizar();
            alert("Acesso concedido! Você agora pode alterar o status das rodas.");
          } else {
            alert("PIN incorreto. Tente novamente.");
            document.getElementById("inputPin").value = "";
          }
        }

        window.fecharPin = function() {
          document.getElementById("pinOverlay").classList.remove("ativo");
        }

        window.alterarStatus = alterarStatus; // Torna a função global para o HTML chamar

        carregarProdutos();
      })();
    </script>
  </body>
</html>
