<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Catálogo de Rodas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --dark: #111827;
      --dark-2: #1f2937;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #16a34a;
      --green-dark: #15803d;
      --red: #dc2626;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    body {
      font-family:
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #ffffff 0,
          #f4f5f7 45%,
          #eef0f3 100%
        );
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(255, 255, 255, 0.08),
          transparent 35%
        ),
        linear-gradient(135deg, #111827, #030712);

      color: #fff;
      padding: 28px 18px 24px;

      position: sticky;
      top: 0;
      z-index: 20;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.18);
    }

    .header-content {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;

      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;

      font-size: 1.35rem;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .search-wrapper {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }

    #searchInput {
      width: 100%;
      height: 52px;

      padding: 0 18px 0 48px;

      font-size: 0.98rem;
      color: #111827;

      background: #ffffff;

      border: 0;
      border-radius: 16px;

      outline: none;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.18);

      transition:
        box-shadow 0.2s,
        transform 0.2s;
    }

    #searchInput::placeholder {
      color: #9ca3af;
    }

    #searchInput:focus {
      box-shadow:
        0 0 0 3px rgba(34, 197, 94, 0.35),
        0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;

      transform: translateY(-50%);

      color: #6b7280;
      font-size: 1.1rem;

      pointer-events: none;
    }

    .contador {
      margin-top: 12px;

      text-align: center;

      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.65);
    }

    /* =========================================================
       FILTROS
    ========================================================= */

    .toolbar {
      position: sticky;
      top: 121px;
      z-index: 15;

      background: rgba(248, 250, 252, 0.94);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);
    }

    .toolbar-inner {
      max-width: 1400px;
      margin: 0 auto;

      padding: 12px 20px;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .filtros {
      flex: 1;

      display: flex;
      gap: 7px;

      overflow-x: auto;
      scrollbar-width: none;

      padding: 2px;
    }

    .filtros::-webkit-scrollbar {
      display: none;
    }

    .filtros .chip {
      flex-shrink: 0;

      padding: 8px 14px;

      font-size: 0.78rem;
      font-weight: 700;

      color: #475569;
      background: #fff;

      border: 1px solid #dbe1e8;
      border-radius: 999px;

      cursor: pointer;

      transition:
        background 0.18s,
        color 0.18s,
        border 0.18s,
        transform 0.18s;
    }

    .filtros .chip:hover {
      transform: translateY(-1px);
      border-color: #94a3b8;
    }

    .filtros .chip.ativo {
      color: #fff;
      background: #111827;
      border-color: #111827;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.18);
    }

    /* =========================================================
       ORDENAÇÃO
    ========================================================= */

    .ordenacao {
      flex-shrink: 0;
    }

    .ordenacao select {
      height: 36px;

      padding: 0 30px 0 12px;

      border-radius: 10px;
      border: 1px solid #dbe1e8;

      background: #fff;
      color: #374151;

      font-size: 0.78rem;
      font-weight: 600;

      outline: none;
      cursor: pointer;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 80px 20px;

      color: var(--muted);
    }

    .loading .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #e5e7eb;
      border-top-color: #16a34a;

      border-radius: 50%;

      animation: girar 0.8s linear infinite;

      margin-bottom: 16px;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERRO
    ========================================================= */

    .erro-box {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 50px 20px;

      text-align: center;
    }

    .erro-box .icone {
      font-size: 52px;
      margin-bottom: 14px;
    }

    .erro-box h2 {
      color: #991b1b;
      margin-bottom: 8px;
    }

    .erro-box p {
      color: var(--muted);
      max-width: 450px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .erro-box button {
      padding: 11px 20px;

      font-size: 0.9rem;
      font-weight: 700;

      background: #111827;
      color: #fff;

      border: 0;
      border-radius: 10px;

      cursor: pointer;
    }

    /* =========================================================
       GRID
    ========================================================= */

    .grid-container {
      flex: 1;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(250px, 1fr)
        );

      gap: 22px;

      padding: 28px;

      max-width: 1400px;
      width: 100%;

      margin: 0 auto;
    }

    /* =========================================================
       CARD
    ========================================================= */

    .card {
      background: var(--surface);

      border: 1px solid rgba(226, 232, 240, 0.9);

      border-radius: 18px;

      overflow: hidden;

      box-shadow: var(--shadow);

      display: flex;
      flex-direction: column;

      position: relative;

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
    }

    .card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 16px 38px rgba(15, 23, 42, 0.14);

      border-color: #d1d5db;
    }

    /* =========================================================
       IMAGEM
    ========================================================= */

    .image-wrapper {
      position: relative;
      background: #eef0f3;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 225px;

      object-fit: cover;

      display: block;

      background: #eef0f3;

      transition:
        transform 0.35s ease;
    }

    .card:hover img {
      transform: scale(1.035);
    }

    /* =========================================================
       VENDIDO
    ========================================================= */

    .card.vendido::after {
      content: "VENDIDO";

      position: absolute;

      top: 16px;
      right: 16px;

      background: rgba(220, 38, 38, 0.94);

      color: #fff;

      font-size: 0.68rem;
      font-weight: 800;

      padding: 6px 10px;

      border-radius: 7px;

      letter-spacing: 0.7px;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .card.vendido img {
      filter:
        grayscale(70%)
        brightness(0.8);
    }

    /* =========================================================
       CORPO DO CARD
    ========================================================= */

    .card-body {
      padding: 16px 17px 18px;

      display: flex;
      flex-direction: column;

      gap: 8px;

      flex: 1;
    }

    .codigo {
      font-size: 0.72rem;

      font-weight: 700;

      color: #94a3b8;

      letter-spacing: 0.7px;

      text-transform: uppercase;
    }

    .card-body h3 {
      font-size: 0.98rem;

      line-height: 1.4;

      color: #172033;

      font-weight: 700;

      min-height: 2.8em;
    }

    /* =========================================================
       BADGES
    ========================================================= */

    .badges {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-top: 2px;
    }

    .status,
    .dispo {
      display: inline-flex;
      align-items: center;

      font-size: 0.66rem;

      font-weight: 800;

      padding: 4px 9px;

      border-radius: 999px;

      text-transform: uppercase;

      letter-spacing: 0.4px;
    }

    .status {
      background: #dcfce7;
      color: #166534;
    }

    .dispo {
      background: #fee2e2;
      color: #991b1b;
    }

    /* =========================================================
       PREÇO
    ========================================================= */

    .preco {
      font-size: 1.35rem;

      font-weight: 800;

      color: var(--green);

      margin-top: auto;
      padding-top: 8px;

      letter-spacing: -0.3px;
    }

    /* =========================================================
       VAZIO
    ========================================================= */

    .vazio {
      grid-column: 1 / -1;

      text-align: center;

      font-size: 1rem;

      color: #6b7280;

      padding: 80px 20px;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      background: #0b1120;

      color: #64748b;

      text-align: center;

      padding: 18px;

      font-size: 0.76rem;

      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {

      header {
        padding: 20px 14px 18px;
      }

      .brand {
        margin-bottom: 14px;
      }

      header h1 {
        font-size: 1.3rem;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        font-size: 1.15rem;
      }

      #searchInput {
        height: 48px;
        font-size: 0.92rem;
      }

      .toolbar {
        top: 106px;
      }

      .toolbar-inner {
        padding: 9px 12px;
        display: block;
      }

      .filtros {
        width: 100%;
      }

      .ordenacao {
        margin-top: 8px;
        text-align: right;
      }

      .ordenacao select {
        width: 100%;
        height: 34px;
      }

      .grid-container {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap: 12px;

        padding: 14px;
      }

      .card {
        border-radius: 14px;
      }

      .card img {
        height: 155px;
      }

      .card-body {
        padding: 12px;
        gap: 6px;
      }

      .card-body h3 {
        font-size: 0.86rem;
      }

      .codigo {
        font-size: 0.65rem;
      }

      .preco {
        font-size: 1.08rem;
      }

      .status,
      .dispo {
        font-size: 0.58rem;
        padding: 3px 7px;
      }

      .card.vendido::after {
        top: 10px;
        right: 10px;
        font-size: 0.58rem;
        padding: 5px 7px;
      }
    }

    @media (max-width: 420px) {

      .grid-container {
        gap: 10px;
        padding: 10px;
      }

      .card img {
        height: 145px;
      }

      .card-body h3 {
        font-size: 0.82rem;
      }
    }
  </style>

</head>

  <!-- =========================================================
       JAVASCRIPT
       LÓGICA ORIGINAL MANTIDA
  ========================================================= -->

  <script>

    (function () {

      "use strict";

      const URL_JSON = "produtos.json";

      const EXTENSOES = [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ];

      let produtos = [];

      let filtroAroAtual = "todos";

      let ordenacaoAtual = "codigo";


      /* =======================================================
         CARREGAR JSON
      ======================================================= */

      async function carregarProdutos() {

        try {

          const resposta =
            await fetch(
              URL_JSON,
              {
                cache: "no-cache"
              }
            );

          if (!resposta.ok)

            throw new Error(
              "Arquivo produtos.json não encontrado (HTTP " +
              resposta.status +
              ")"
            );


          const dados =
            await resposta.json();


          if (!Array.isArray(dados))

            throw new Error(
              "Formato do produtos.json inválido"
            );


          function limparTexto(v) {

            if (
              v === null ||
              v === undefined
            )

              return "";

            var s =
              String(v).trim();

            var low =
              s.toLowerCase();


            if (
              low === "nan" ||
              low === "null" ||
              low === "undefined" ||
              low === "none" ||
              low === ""
            )

              return "";

            return s.toUpperCase();

          }


          produtos =
            dados

              .map(function (p) {

                var status =
                  limparTexto(p.status);

                var disp =
                  limparTexto(
                    p.disponibilidade
                  );


                return {

                  codigo:
                    String(
                      p.codigo || ""
                    ).trim(),

                  nome:
                    String(
                      p.nome || ""
                    )
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim(),

                  valor:
                    Number(
                      p.valor
                    ) || 0,

                  status:
                    status,

                  disponibilidade:
                    disp,

                  aro:
                    p.aro ||
                    extrairAro(p.nome),

                  vendido:
                    disp === "VENDIDO"

                };

              })

              .filter(function (p) {

                return p.codigo;

              });


          if (!produtos.length)

            throw new Error(
              "Nenhum produto no arquivo"
            );


          document
            .getElementById(
              "loadingBox"
            )
            .style.display = "none";


          document
            .getElementById(
              "gridRodas"
            )
            .style.display = "grid";


          renderizar();

        }

        catch (err) {

          console.error(err);

          document
            .getElementById(
              "loadingBox"
            )
            .style.display = "none";


          document
            .getElementById(
              "erroBox"
            )
            .style.display = "flex";


          document
            .getElementById(
              "erroMsg"
            )
            .innerHTML =
              "Erro: " +
              err.message +
              "<br><br>" +
              "Verifique se o arquivo " +
              "<strong>produtos.json</strong>" +
              " está na mesma pasta do index.html.";

        }

      }


      /* =======================================================
         EXTRAIR ARO
      ======================================================= */

      function extrairAro(nome) {

        var m =
          String(nome).match(
            /ARO\s*(\d{1,2})/i
          );

        return m
          ? parseInt(m[1], 10)
          : null;

      }


      /* =======================================================
         FILTROS E ORDENAÇÃO
      ======================================================= */

      function aplicarFiltros() {

        var lista =
          produtos.slice();


        if (
          filtroAroAtual !==
          "todos"
        ) {

          var aro =
            parseInt(
              filtroAroAtual,
              10
            );


          lista =
            lista.filter(
              function (p) {

                return p.aro === aro;

              }
            );

        }


        var termo =
          document
            .getElementById(
              "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


        if (termo) {

          lista =
            lista.filter(
              function (p) {

                return (

                  p.codigo
                    .toLowerCase()
                    .indexOf(
                      termo
                    ) !== -1

                  ||

                  p.nome
                    .toLowerCase()
                    .indexOf(
                      termo
                    ) !== -1

                );

              }
            );

        }


        switch (
          ordenacaoAtual
        ) {

          case "menor":

            lista.sort(
              function (a, b) {

                return (
                  a.valor -
                  b.valor
                );

              }
            );

            break;


          case "maior":

            lista.sort(
              function (a, b) {

                return (
                  b.valor -
                  a.valor
                );

              }
            );

            break;


          case "nome":

            lista.sort(
              function (a, b) {

                return a.nome.localeCompare(
                  b.nome
                );

              }
            );

            break;


          default:

            lista.sort(
              function (a, b) {

                return a.codigo.localeCompare(
                  b.codigo
                );

              }
            );

        }


        return lista;

      }


      /* =======================================================
         RENDER
      ======================================================= */

      function renderizar() {

        var lista =
          aplicarFiltros();


        var container =
          document.getElementById(
            "gridRodas"
          );


        container.innerHTML = "";


        document
          .getElementById(
            "contador"
          )
          .textContent =
            lista.length +
            " roda(s) encontrada(s)";


        if (!lista.length) {

          container.innerHTML =
            '<p class="vazio">' +
            "Nenhuma roda encontrada." +
            "</p>";

          return;

        }


        var frag =
          document.createDocumentFragment();


        lista.forEach(
          function (item) {

            var card =
              document.createElement(
                "div"
              );


            card.className =
              "card" +
              (
                item.vendido
                  ? " vendido"
                  : ""
              );


            /* IMAGEM */

            var imageWrapper =
              document.createElement(
                "div"
              );

            imageWrapper.className =
              "image-wrapper";


            var img =
              document.createElement(
                "img"
              );


            img.alt =
              item.nome;


            img.loading =
              "lazy";


            var iExt = 0;


            var tentarExt =
              function () {

                if (
                  iExt >=
                  EXTENSOES.length
                ) {

                  img.onerror =
                    null;

                  img.src =
                    "placeholder.jpg";

                  return;

                }


                img.src =
                  "fotos/" +
                  item.codigo +
                  "." +
                  EXTENSOES[
                    iExt++
                  ];

              };


            img.onerror =
              tentarExt;


            tentarExt();


            imageWrapper.appendChild(
              img
            );


            card.appendChild(
              imageWrapper
            );


            /* CORPO */

            var body =
              document.createElement(
                "div"
              );


            body.className =
              "card-body";


            /* CÓDIGO */

            var spanCod =
              document.createElement(
                "span"
              );


            spanCod.className =
              "codigo";


            spanCod.textContent =
              "CÓD: " +
              item.codigo;


            body.appendChild(
              spanCod
            );


            /* NOME */

            var h3 =
              document.createElement(
                "h3"
              );


            h3.textContent =
              item.nome;


            body.appendChild(
              h3
            );


            /* BADGES */

            if (
              item.status ||
              item.disponibilidade
            ) {

              var badges =
                document.createElement(
                  "div"
                );


              badges.className =
                "badges";


              if (item.status) {

                var s =
                  document.createElement(
                    "span"
                  );


                s.className =
                  "status";


                s.textContent =
                  item.status;


                badges.appendChild(
                  s
                );

              }


              if (
                item.disponibilidade
              ) {

                var d =
                  document.createElement(
                    "span"
                  );


                d.className =
                  "dispo";


                d.textContent =
                  item.disponibilidade;


                badges.appendChild(
                  d
                );

              }


              body.appendChild(
                badges
              );

            }


            /* PREÇO */

            var pPreco =
              document.createElement(
                "p"
              );


            pPreco.className =
              "preco";


            pPreco.textContent =
              "R$ " +
              item.valor.toLocaleString(
                "pt-BR",
                {
                  minimumFractionDigits: 2
                }
              );


            body.appendChild(
              pPreco
            );


            card.appendChild(
              body
            );


            frag.appendChild(
              card
            );

          }
        );


        container.appendChild(
          frag
        );

      }


      /* =======================================================
         EVENTOS
      ======================================================= */

      document
        .getElementById(
          "searchInput"
        )
        .addEventListener(
          "input",
          renderizar
        );


      document
        .querySelectorAll(
          ".chip"
        )
        .forEach(
          function (chip) {

            chip.addEventListener(
              "click",
              function () {

                document
                  .querySelectorAll(
                    ".chip"
                  )
                  .forEach(
                    function (c) {

                      c.classList.remove(
                        "ativo"
                      );

                    }
                  );


                chip.classList.add(
                  "ativo"
                );


                filtroAroAtual =
                  chip.dataset.aro;


                renderizar();

              }
            );

          }
        );


      document
        .getElementById(
          "ordenarPor"
        )
        .addEventListener(
          "change",
          function (e) {

            ordenacaoAtual =
              e.target.value;

            renderizar();

          }
        );


      /* =======================================================
         INIT
      ======================================================= */

      carregarProdutos();

    })();

  </script>

</body>
</html>
