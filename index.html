<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Rodas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #0b0f17;
        --bg-surface: #151c28;
        --bg-card: #1e293b;
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-color: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.2);
        --price-color: #4ade80;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 24px 20px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 20;
      }

      header h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 16px;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .search-wrapper {
        position: relative;
        max-width: 540px;
        margin: 0 auto;
      }

      #searchInput {
        width: 100%;
        padding: 14px 20px 14px 46px;
        font-size: 0.95rem;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border: 1px solid var(--border-color);
        border-radius: 99px;
        outline: none;
        transition: all 0.25s ease;
      }

      .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        pointer-events: none;
        font-size: 1.1rem;
      }

      #searchInput:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent-color);
        box-shadow: 0 0 0 4px var(--accent-glow);
      }

      #searchInput::placeholder {
        color: #64748b;
      }

      .contador {
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .controls-bar {
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
        padding: 14px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .filtros-status {
        display: flex;
        background: rgba(0, 0, 0, 0.25);
        padding: 4px;
        border-radius: 99px;
        border: 1px solid var(--border-color);
      }

      .btn-status {
        padding: 8px 18px;
        font-size: 0.8rem;
        font-weight: 700;
        border-radius: 99px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-status.ativo {
        background: var(--accent-color);
        color: #0f172a;
        box-shadow: 0 2px 8px var(--accent-glow);
      }

      .btn-status.ativo[data-status="vendidos"] {
        background: #ef4444;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
      }

      .filtros {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }

      .filtros .chip {
        padding: 8px 16px;
        font-size: 0.8rem;
        font-family: inherit;
        border: 1px solid var(--border-color);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-secondary);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .filtros .chip:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      .filtros .chip.ativo {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }

      .ordenacao select {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        font-size: 0.85rem;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
        outline: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .ordenacao select:hover, .ordenacao select:focus {
        border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      .loading {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px;
        color: var(--text-secondary);
      }

      .loading .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: girar 0.8s linear infinite;
        margin-bottom: 18px;
      }

      @keyframes girar {
        to { transform: rotate(360deg); }
      }

      .erro-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
      }

      .erro-box .icone {
        font-size: 56px;
        margin-bottom: 16px;
      }

      .erro-box h2 {
        color: #f87171;
        margin-bottom: 8px;
        font-size: 1.3rem;
      }

      .erro-box p {
        color: var(--text-secondary);
        max-width: 420px;
        margin-bottom: 24px;
        line-height: 1.5;
        font-size: 0.95rem;
      }

      .erro-box button {
        padding: 12px 28px;
        font-size: 0.9rem;
        font-weight: 700;
        font-family: inherit;
        background: var(--accent-color);
        color: #0f172a;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .erro-box button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px var(--accent-glow);
      }

      .grid-container {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
        padding: 32px 24px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .card:hover {
        transform: translateY(-6px);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }

      .card.vendido::before {
        content: "VENDIDO";
        position: absolute;
        top: 16px;
        right: -32px;
        background: #ef4444;
        color: #fff;
        font-size: 0.65rem;
        font-weight: 800;
        padding: 4px 36px;
        transform: rotate(35deg);
        letter-spacing: 1px;
        z-index: 2;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .card.vendido img {
        filter: grayscale(80%) opacity(0.6);
      }

      .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        background: #0f172a;
        display: block;
        border-bottom: 1px solid var(--border-color);
      }

      .card-body {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .codigo {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent-color);
        letter-spacing: 1px;
      }

      .card-body h3 {
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text-primary);
        min-height: 2.8em;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .status, .dispo {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status {
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }

      .dispo {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .preco {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--price-color);
        margin-top: auto;
        padding-top: 8px;
      }

      .vazio {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 1rem;
        color: var(--text-secondary);
        padding: 80px 20px;
      }

      footer {
        background: var(--bg-surface);
        border-top: 1px solid var(--border-color);
        color: var(--text-secondary);
        text-align: center;
        padding: 20px;
        font-size: 0.85rem;
        margin-top: auto;
      }

      @media (max-width: 600px) {
        header h1 { font-size: 1.4rem; }
        .grid-container {
          grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 14px;
          padding: 16px 12px;
        }
        .card img { height: 160px; }
        .card-body { padding: 12px; }
        .card-body h3 { font-size: 0.85rem; }
        .preco { font-size: 1.15rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🛞 Catálogo de Rodas</h1>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar por código, aro ou modelo..."
          autocomplete="off"
        />
      </div>
      <p id="contador" class="contador"></p>
    </header>

    <div class="controls-bar">
      <!-- Seletor Principal de Status: Disponíveis / Vendidos / Todos -->
      <div class="filtros-status">
        <button class="btn-status ativo" data-status="disponiveis">Disponíveis</button>
        <button class="btn-status" data-status="vendidos">Vendidos</button>
        <button class="btn-status" data-status="todos">Todos</button>
      </div>

      <!-- Chips de aro são gerados DINAMICAMENTE pelo JS -->
      <div class="filtros" id="filtrosAro"></div>

      <div class="ordenacao">
        <select id="ordenarPor">
          <option value="codigo">Ordenar: Código</option>
          <option value="menor">Ordenar: Menor preço</option>
          <option value="maior">Ordenar: Maior preço</option>
          <option value="nome">Ordenar: Nome (A-Z)</option>
        </select>
      </div>
    </div>

    <!-- Estado de carregamento -->
    <div class="loading" id="loadingBox">
      <div class="spinner"></div>
      <p>Carregando catálogo...</p>
    </div>

    <!-- Estado de erro -->
    <div class="erro-box" id="erroBox" style="display: none">
      <div class="icone">⚠️</div>
      <h2>Não foi possível carregar o catálogo</h2>
      <p id="erroMsg">
        Verifique se o arquivo <strong>produtos.json</strong> está no
        repositório.
      </p>
      <button onclick="location.reload()">🔄 Tentar novamente</button>
    </div>

    <main id="gridRodas" class="grid-container" style="display: none"></main>

    <footer>
      <p>© Catálogo de Rodas</p>
    </footer>

    <script>
      (function () {
        "use strict";

        const URL_JSON = "produtos.json";
        const EXTENSOES = ["jpg", "jpeg", "png", "webp"];

        let produtos = [];
        let filtroStatusAtual = "disponiveis"; // Padrão: ocultar vendidos
        let filtroAroAtual = "todos";
        let ordenacaoAtual = "codigo";

        /* ============ CARREGAR JSON ============ */
        async function carregarProdutos() {
          try {
            const resposta = await fetch(URL_JSON, { cache: "no-cache" });
            if (!resposta.ok)
              throw new Error(
                "Arquivo produtos.json não encontrado (HTTP " +
                  resposta.status +
                  ")",
              );

            const dados = await resposta.json();
            if (!Array.isArray(dados))
              throw new Error("Formato do produtos.json inválido");

            function limparTexto(v) {
              if (v === null || v === undefined) return "";
              var s = String(v).trim();
              var low = s.toLowerCase();
              if (
                low === "nan" ||
                low === "null" ||
                low === "undefined" ||
                low === "none" ||
                low === ""
              )
                return "";
              return s.toUpperCase();
            }

            produtos = dados
              .map(function (p) {
                var status = limparTexto(p.status);
                var disp = limparTexto(p.disponibilidade);
                return {
                  codigo: String(p.codigo || "").trim(),
                  nome: String(p.nome || "")
                    .replace(/\s+/g, " ")
                    .trim(),
                  valor: Number(p.valor) || 0,
                  status: status,
                  disponibilidade: disp,
                  aro: p.aro || extrairAro(p.nome),
                  vendido: disp === "VENDIDO",
                };
              })
              .filter(function (p) {
                return p.codigo;
              });

            if (!produtos.length) throw new Error("Nenhum produto no arquivo");

            // 🔥 Cria os chips de aro DINAMICAMENTE
            gerarChipsDeAro();

            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("gridRodas").style.display = "grid";
            renderizar();
          } catch (err) {
            console.error(err);
            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("erroBox").style.display = "flex";
            document.getElementById("erroMsg").innerHTML =
              "Erro: " +
              err.message +
              "<br><br>" +
              "Verifique se o arquivo <strong>produtos.json</strong> está na mesma pasta do index.html.";
          }
        }

        function extrairAro(nome) {
          var m = String(nome).match(/ARO\s*(\d{1,2})/i);
          return m ? parseInt(m[1], 10) : null;
        }

        /* ============ CHIPS DE ARO DINÂMICOS ============ */
        function gerarChipsDeAro() {
          var container = document.getElementById("filtrosAro");
          container.innerHTML = "";

          // 1. Extrai todos os aros únicos (ignora null)
          var arosUnicos = [];
          produtos.forEach(function (p) {
            if (p.aro && arosUnicos.indexOf(p.aro) === -1) {
              arosUnicos.push(p.aro);
            }
          });

          // 2. Ordena do menor pro maior
          arosUnicos.sort(function (a, b) { return a - b; });

          // 3. Cria o chip "Todos os Aros" sempre primeiro
          var chipTodos = document.createElement("button");
          chipTodos.className = "chip ativo";
          chipTodos.dataset.aro = "todos";
          chipTodos.textContent = "Todos os Aros";
          chipTodos.addEventListener("click", function () {
            ativarChipAro(chipTodos, "todos");
          });
          container.appendChild(chipTodos);

          // 4. Cria um chip pra cada aro encontrado
          arosUnicos.forEach(function (aro) {
            var chip = document.createElement("button");
            chip.className = "chip";
            chip.dataset.aro = String(aro);
            chip.textContent = "Aro " + aro;
            chip.addEventListener("click", function () {
              ativarChipAro(chip, String(aro));
            });
            container.appendChild(chip);
          });
        }

        function ativarChipAro(chipClicado, aro) {
          document
            .querySelectorAll("#filtrosAro .chip")
            .forEach(function (c) {
              c.classList.remove("ativo");
            });
          chipClicado.classList.add("ativo");
          filtroAroAtual = aro;
          renderizar();
        }

        /* ============ FILTROS E ORDENAÇÃO ============ */
        function aplicarFiltros() {
          var lista = produtos.slice();

          // 1. Filtro por Status
          if (filtroStatusAtual === "disponiveis") {
            lista = lista.filter(function (p) { return !p.vendido; });
          } else if (filtroStatusAtual === "vendidos") {
            lista = lista.filter(function (p) { return p.vendido; });
          }

          // 2. Filtro por Aro
          if (filtroAroAtual !== "todos") {
            var aro = parseInt(filtroAroAtual, 10);
            lista = lista.filter(function (p) {
              return p.aro === aro;
            });
          }

          // 3. Busca
          var termo = document
            .getElementById("searchInput")
            .value.toLowerCase()
            .trim();
          if (termo) {
            lista = lista.filter(function (p) {
              return (
                p.codigo.toLowerCase().indexOf(termo) !== -1 ||
                p.nome.toLowerCase().indexOf(termo) !== -1
              );
            });
          }

          // 4. Ordenação
          switch (ordenacaoAtual) {
            case "menor":
              lista.sort(function (a, b) { return a.valor - b.valor; });
              break;
            case "maior":
              lista.sort(function (a, b) { return b.valor - a.valor; });
              break;
            case "nome":
              lista.sort(function (a, b) { return a.nome.localeCompare(b.nome); });
              break;
            default:
              lista.sort(function (a, b) { return a.codigo.localeCompare(b.codigo); });
          }

          return lista;
        }

        /* ============ RENDER ============ */
        function renderizar() {
          var lista = aplicarFiltros();
          var container = document.getElementById("gridRodas");
          container.innerHTML = "";

          document.getElementById("contador").textContent =
            lista.length + " roda(s) encontrada(s)";

          if (!lista.length) {
            container.innerHTML =
              '<p class="vazio">Nenhuma roda encontrada.</p>';
            return;
          }

          var frag = document.createDocumentFragment();

          lista.forEach(function (item) {
            var card = document.createElement("div");
            card.className = "card" + (item.vendido ? " vendido" : "");

            var img = document.createElement("img");
            img.alt = item.nome;
            img.loading = "lazy";
            var iExt = 0;
            var tentarExt = function () {
              if (iExt >= EXTENSOES.length) {
                img.onerror = null;
                img.src = "placeholder.jpg";
                return;
              }
              img.src = "fotos/" + item.codigo + "." + EXTENSOES[iExt++];
            };
            img.onerror = tentarExt;
            tentarExt();
            card.appendChild(img);

            var body = document.createElement("div");
            body.className = "card-body";

            var spanCod = document.createElement("span");
            spanCod.className = "codigo";
            spanCod.textContent = "CÓD: " + item.codigo;
            body.appendChild(spanCod);

            var h3 = document.createElement("h3");
            h3.textContent = item.nome;
            body.appendChild(h3);

            if (item.status || item.disponibilidade) {
              var badges = document.createElement("div");
              badges.className = "badges";
              if (item.status) {
                var s = document.createElement("span");
                s.className = "status";
                s.textContent = item.status;
                badges.appendChild(s);
              }
              if (item.disponibilidade) {
                var d = document.createElement("span");
                d.className = "dispo";
                d.textContent = item.disponibilidade;
                badges.appendChild(d);
              }
              body.appendChild(badges);
            }

            var pPreco = document.createElement("p");
            pPreco.className = "preco";
            pPreco.textContent =
              "R$ " +
              item.valor.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
            body.appendChild(pPreco);

            card.appendChild(body);
            frag.appendChild(card);
          });

          container.appendChild(frag);
        }

        /* ============ EVENTOS ============ */
        document
          .getElementById("searchInput")
          .addEventListener("input", renderizar);

        document.querySelectorAll(".btn-status").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".btn-status").forEach(function (b) {
              b.classList.remove("ativo");
            });
            btn.classList.add("ativo");
            filtroStatusAtual = btn.dataset.status;
            renderizar();
          });
        });

        document
          .getElementById("ordenarPor")
          .addEventListener("change", function (e) {
            ordenacaoAtual = e.target.value;
            renderizar();
          });

        /* ============ INIT ============ */
        carregarProdutos();
      })();
    </script>
  </body>
</html>
